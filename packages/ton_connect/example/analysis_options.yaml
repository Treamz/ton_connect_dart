# Self-contained on purpose. This file ships inside the published archive,
# where a relative include reaching outside the package does not resolve — and
# `dart format` then fails outright rather than falling back.
include: package:lints/recommended.yaml

linter:
  rules:
    # An example is read, not imported. Documenting every private helper would
    # bury the flow it exists to show.
    public_member_api_docs: false
