name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The workspace contains a Flutter package, so the Flutter SDK resolves it
      # all; the Dart SDK alone cannot.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # The workspace root has no test/ directory, so tests run per package.
      - name: Test ton_connect
        run: dart test packages/ton_connect

      - name: Test ton_connect_ui
        run: flutter test
        working-directory: packages/ton_connect_ui

      - name: Test the example
        run: flutter test
        working-directory: packages/ton_connect_ui/example

      # The web transports are chosen by conditional import and never execute on
      # the VM, so compiling for the web is what proves they still build.
      - name: Compile for the web
        run: dart compile js -o build/web_smoke.js tool/web_smoke.dart
        working-directory: packages/ton_connect
