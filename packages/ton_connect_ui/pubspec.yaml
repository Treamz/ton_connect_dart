name: ton_connect_ui
description: >-
  Flutter UI for TON Connect: a wallet-picker modal backed by the public wallet
  registry, QR and deep-link connect flows, and ready-made connect widgets.
version: 0.1.0-dev.1
repository: https://github.com/Treamz/ton_connect_dart
issue_tracker: https://github.com/Treamz/ton_connect_dart/issues

topics:
  - ton
  - blockchain
  - wallet
  - crypto

environment:
  sdk: ^3.12.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  qr: ^4.0.0
  ton_connect: ^0.1.0-dev.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  http: ^1.5.0
  lints: ^6.0.0
