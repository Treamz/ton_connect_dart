name: ton_connect
description: >-
  Pure Dart implementation of the TON Connect 2 protocol: encrypted HTTP bridge
  sessions, the injected JS bridge, the wallet registry and universal links.
version: 0.1.0-dev.1
repository: https://github.com/Treamz/ton_connect_dart
issue_tracker: https://github.com/Treamz/ton_connect_dart/issues

topics:
  - ton
  - blockchain
  - wallet
  - crypto

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  http: ^1.5.0
  meta: ^1.17.0
  pinenacl: ^0.6.0
  web: ^1.1.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
